version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine bumps; majors stay separate for review.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The msrv job pins this to the rust-version in Cargo.toml deliberately.
      # Dependabot reads the ref as a version and proposes bumping it, which
      # would compile that job with a newer toolchain and leave the MSRV claim
      # unverified while the job still reported green.
      - dependency-name: dtolnay/rust-toolchain
