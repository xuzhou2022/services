[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Internal service crates; nothing here belongs on crates.io.
publish = false
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/xuzhou2022/services"

[workspace.lints.rust]
# Nothing here has a reason to reach for unsafe; make that enforceable
# rather than a convention.
unsafe_code = "forbid"

[workspace.dependencies]
common = { path = "crates/common" }

[profile.release]
lto = "thin"
strip = "symbols"
